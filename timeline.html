<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exhibitions Timeline</title>
<style>
:root{
  --bg:#f7f4ee; --panel:#fffdf9; --ink:#22201c; --muted:#6f685d; --line:#ddd5c7;
  --accent:#8a3b1e; --accent-soft:#f1dfd3; --bar:#c98a5e; --hl:#fff3c4;
  --int:#2f5d7c; --nat:#57702f; --col:#8a3b1e; --reg:#7a6a2a; --spe:#6b4a8a; --oth:#6f685d;
  --sea:#e9eef0; --land:#cfc8ba; --dotline:#ffffff; --no:#a3261c; --no-soft:#c4635a; --no-bg:#fbe9e6; --warn:#8a6a00; --warn-bg:#fbf1cf;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#191715; --panel:#22201d; --ink:#ece6da; --muted:#a39a8b; --line:#3a3631;
    --accent:#e39a6f; --accent-soft:#3b2a20; --bar:#b4703f; --hl:#5a4a12;
    --int:#7fb2d6; --nat:#a5c275; --col:#e39a6f; --reg:#d3c074; --spe:#b79ad6; --oth:#a39a8b;
    --sea:#15191b; --land:#55504a; --dotline:#191715; --no:#f08a7e; --no-soft:#f3aca3; --no-bg:#3d1f1b; --warn:#e6c65a; --warn-bg:#3a3214; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.sans{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
header{padding:28px 24px 6px;max-width:1100px;margin:0 auto}
h1{font-size:28px;margin:0 0 4px;font-weight:600}
header p{margin:0;color:var(--muted);max-width:78ch}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px 80px}
.hist{display:flex;align-items:flex-end;gap:2px;height:74px;margin:18px 0 4px;border-bottom:1px solid var(--line)}
.hist button{flex:1;min-width:0;border:0;padding:0;background:var(--bar);border-radius:2px 2px 0 0;cursor:pointer;position:relative;opacity:.85}
.hist button:hover{opacity:1;background:var(--accent)}
.hist button.off{opacity:.25}
.histlab{display:flex;gap:2px;font:10.5px -apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--muted);margin-bottom:10px}
.histlab span{flex:1;min-width:0;text-align:center;overflow:hidden;white-space:nowrap}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:grid;grid-template-columns:2fr 1.2fr 1fr 1.2fr 1fr auto;gap:8px;border-bottom:1px solid var(--line)}
.filters label{display:flex;flex-direction:column;font:11px/1.2 -apple-system,"Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);gap:3px;min-width:0}
.filters input[type=search],.filters select{font:14px -apple-system,"Helvetica Neue",Arial,sans-serif;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-width:0;width:100%}
.filters button{align-self:end;font:13px -apple-system,"Helvetica Neue",Arial,sans-serif;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
.opts{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font:13px -apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--muted);margin:10px 0 0}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.status{font:13px -apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--muted);margin:8px 0 16px}
.decade{font:600 22px/1 "Iowan Old Style",Palatino,Georgia,serif;margin:34px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.decade small{font:12.5px -apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--muted);font-weight:400}
.yr{display:grid;grid-template-columns:64px 1fr;gap:0 14px}
.yr>.y{font:600 16px/1.6 -apple-system,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;color:var(--accent);padding-top:10px;position:sticky;top:64px;align-self:start}
.items{border-left:2px solid var(--line);padding-left:16px}
.it{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 14px;margin:8px 0;cursor:pointer}
.it:before{content:"";position:absolute;left:-23px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--bar);border:2px solid var(--bg)}
.it.no{border-style:dashed;border-color:var(--no)}
.it.no:before{background:var(--bg);border:2px solid var(--no)}
.it.no .nm{color:var(--no-soft)}
.it.bl{opacity:.92}
.top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.nm{font-weight:600;font-size:16.5px}
.orig{font-style:italic;color:var(--muted)}
.cjk{font-style:normal}
.b[data-f]{cursor:pointer}
.b[data-f]:hover{filter:brightness(.92);box-shadow:0 0 0 2px var(--accent-soft)}
.mapbox{position:relative;margin:16px 0 6px;border:1px solid var(--line);border-radius:8px;background:var(--sea);overflow:hidden}
.sp{display:inline-block;margin-top:6px;font:600 13px -apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:3px 11px}
.sp:hover{background:var(--accent-soft)}
#map{display:block;width:100%;height:auto;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
#land{fill:var(--land);stroke:var(--land);stroke-width:.8;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:12.5px -apple-system,"Helvetica Neue",Arial,sans-serif;padding:4px 9px;border-radius:5px;white-space:nowrap;transform:translate(-50%,-135%);opacity:0;transition:opacity .08s;z-index:3}
#tip.on{opacity:1}
#dots circle{cursor:pointer;stroke:var(--dotline);vector-effect:non-scaling-stroke;stroke-width:.7}
#dots circle.sel{stroke:var(--ink);stroke-width:2.6}
.mapbtns{position:absolute;top:8px;left:8px;display:flex;flex-wrap:wrap;gap:4px}
.mapbtns button{font:12px -apple-system,"Helvetica Neue",Arial,sans-serif;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);cursor:pointer;opacity:.92}
.maplegend{position:absolute;bottom:8px;left:10px;font:11.5px -apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--muted);display:flex;gap:6px;align-items:center;background:var(--panel);padding:3px 8px;border-radius:5px;opacity:.92}
.maplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 3px 0 5px;vertical-align:-1px}
.maphint{font:11.5px -apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--muted);margin:4px 2px 0}
.yrange{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin:12px 0 2px;font:13px -apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--muted)}
.yrange b{color:var(--ink);font-variant-numeric:tabular-nums}
.dual{position:relative;height:26px}
.dual:before{content:"";position:absolute;left:0;right:0;top:11px;height:4px;background:var(--line);border-radius:2px}
.dual .fill{position:absolute;top:11px;height:4px;background:var(--accent);border-radius:2px}
.dual input{position:absolute;left:0;top:0;width:100%;height:26px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input::-webkit-slider-runnable-track{background:none;height:26px}
.dual input::-moz-range-track{background:none}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);margin-top:5px;cursor:pointer}
.dual input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);cursor:pointer}
.chip{display:inline-block;font:12.5px -apple-system,"Helvetica Neue",Arial,sans-serif;padding:3px 9px;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer;margin-right:6px}
.where{font:13.5px -apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--muted);margin-top:2px}
.where b{color:var(--ink);font-weight:600}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto}
.b{font:11px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;padding:4px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.b.international{color:var(--int)}.b.national{color:var(--nat)}.b.colonial{color:var(--col)}.b.regional{color:var(--reg)}.b.specialised{color:var(--spe)}.b.other{color:var(--oth)}
.b.flag{color:var(--no);background:var(--no-bg);border-color:var(--no);font-weight:600}
.b.plan{color:var(--warn);background:var(--warn-bg);border-color:var(--warn)}
.b.bord{color:var(--muted);border-style:dashed}
.b.n{color:var(--muted);border-color:var(--line)}
.desc{margin:6px 0 0;max-width:80ch}
.more{display:none;margin-top:8px;padding-top:8px;border-top:1px dotted var(--line);font:13px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif}
.it.open .more{display:block}
.more ul{margin:3px 0 8px;padding-left:18px}
.lab{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--muted)}
.ed{background:var(--warn-bg);color:var(--ink);border-left:3px solid var(--warn);padding:5px 9px;border-radius:0 4px 4px 0;margin:6px 0}
mark{background:var(--hl);color:inherit;padding:0 1px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:13px -apple-system,"Helvetica Neue",Arial,sans-serif;padding:9px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.on{opacity:1}
@media (max-width:820px){
  .filters{grid-template-columns:1fr 1fr;position:static}
  .yr{grid-template-columns:48px 1fr;gap:0 8px} .yr>.y{position:static}
  .badges{margin-left:0;width:100%}
  header,.wrap{padding-left:16px;padding-right:16px}
}
</style>
</head>

med, 1757)","","","London","","","Great Britain","United Kingdom","Europe","other","held","identity uncertain (unnamed appendix row)","Listed without a name in an appendix table of national and international expositions, 1750-1951.","",["11"],"low","Only an appendix row; no name, venue or description given.","",51.5072,-0.1275,"London"],["F0004",1761,"1761","","","","Exhibition of Agricultural and other Machines","","","London","","","Great Britain","United Kingdom","Europe","specialised","held","","","",["11"],"medium","Possibly related to the Royal Society of Arts prize-winners show of the same year (cluster 8); not merged because the mention gives a different scope.","",51.5072,-0.1275,"London"],["F0005",1761,"1761","","","","Royal Society of Arts exhibition of prize winners","","","London","","","Great Britain","United Kingdom","Europe","other","held","prize show of a society rather than a national exposition","The Royal Society of Arts show of its annual prize winners in arts, manufactures and commerce, which ran for seven weeks. It is an early precursor of the national exhibitions.","",["35"],"medium","Possibly the same event as cluster 7 (1761, London); kept separate because the names differ.","",51.5072,-0.1275,"London"],["F0006",1797,"1797","","","","First French national exhibition (sale of Sèvres, Gobelins and Savonnerie goods)","","French national exhibition of 1797 (Louvre); Hôtel d'Orsay exhibition","Paris","","Louvre forecourt or Hôtel d'Orsay (sources differ)","French Republic (Directory)","France","Europe","national","held","","Held on the initiative of the Marquis d'Avèze to sell unsold stock from the national Sèvres, Gobelins and Savonnerie factories and show that French industry could still compete. It drew crowds and started a regular series of French national exhibitions.","",["07","50"],"medium","Venue conflict: src 07 says Louvre forecourt; src 50 says Hôtel d'Orsay, with other trades added after a first attempt at Saint-Cloud was stopped by Bonaparte. Merged as one event. Whether 1797 or 1798 is the first national exhibition differs by source (see cluster 11 entry).","",48.8567,2.3522,"Paris"],["F0007",1798,"1798","","1798-09-17","1798-09-21","First French national industrial exhibition (Champ de Mars)","Première exposition des produits de l'industrie française","French national exhibition of 1798 (Champs de Mars); French national exposition (1798); French national trade exposition (l'an VI); French national trade fair (Champ de Mars); Industrial exhibition, Champ de Mars; French National Exhibition (first); French national industrial exhibition (Champ de Mars)","Paris","","Champ de Mars","French Republic (Directory)","France","Europe","national","held","","The first French national industrial exhibition, planned by François de Neufchâteau with the Marquis d'Avèze in specially built temporary buildings on the Champ de Mars. About 110 exhibitors took part, the temporary facades were designed by J. J. L. David, and eleven gold medals were awarded.","",["07","11","13","35","37","42","43","50","53"],"high","Year conflict: several sources (07, 11, 43, 53 and others) treat 1798 as the event, while src 07 and 37 count an 1797 show as the first national exhibition (see clusters 9-10). Dates 17-21 Sept 1798 from src 43 (proclaimed 28 Aug, five complementary days of year VI). Cluster 11 also contains a series-level row from src 07 ('French national exhibitions', 1798-1849); it describes the series, so it is not used for this fair's year_end. Src 53 and others give 1849 as the series end.","",48.8567,2.3522,"Paris"],["F0008",1801,"1801","","","","Second French national industrial exhibition (Louvre courtyard)","Exposition des produits de l'industrie française","French National Exhibition, Paris (1801); French national exhibition of 1801 (Louvre); Industrial exhibition, Louvre courtyard","Paris","","Louvre courtyard","French Republic (Consulate)","France","Europe","national","held","","The second French national industrial exhibition, held in the Louvre courtyard under the Consulate, with about double the 1798 exhibitors and exhibits from 38 departments. The Louvre courtyard held 220 manufacturing firms and craft workshops as exhibitors, and war had delayed it from the annual schedule intended.","",["07","11","13","42","43","50","53"],"high","Src 11 gives the venue as Champ de Mars or Louvre, a generic statement; the Louvre is confirmed by 07, 13, 43, 50 and 53. Src 43 calls the Louvre the Palais national des Arts et des Sciences.","",48.8567,2.3522,"Paris"],["F0009",1802,"1802","","","","French national exhibition of 1802 (Louvre courtyard)","","French national trade exposition (1802); Industrial exhibition, Louvre courtyard","Paris","","Louvre courtyard","French Republic (Consulate)","France","Europe","national","held","","Held in the Louvre courtyard with 540 firms and workshops as exhibitors. Sources date the medal jury and awards from this period.","",["07","11","13","53"],"medium","Src 43 and src 35 do not list a 1802 show; src 43 numbers the 1804 show as the third national exhibition, so its count omits 1802. Src 11 describes it only as a repeated trade fair at Champ de Mars or Louvre.","",48.8567,2.3522,"Paris"],["F0010",1804,"1804","","","","Third French national industrial exhibition (Paris, 1804)","Exposition des produits de l'industrie française","","Paris","","","France (Napoleonic Empire)","France","Europe","national","held","","The third French national industrial exhibition, much larger than the 1801 show. Prize criteria were broadened so that luxury articles could win prizes.","",["43"],"medium","Single source (src 43). Exhibitor count and venue not given.","",48.8567,2.3522,"Paris"],["F0011",1805,"1805","","","","Exhibition on the occasion of Napoleon's visit to Turin","","","Turin","","","French Empire (Piedmont annexed)","Italy","Europe","other","held","short occasional show for a royal visit, not a regular fair","A short three-day exposition held for Napoleon's visit to Turin in 1805. The source notes its limited success and reads it as an early attempt at patriotic self-assertion through exhibitions.","",["25"],"medium","","",45.0792,7.6761,"Turin"],["F0012",1806,"1806","","","","French national exhibition of 1806 (Esplanade des Invalides)","Exposition des produits de l'industrie française","Fourth French national industrial exhibition (Paris, 1806); Industrial exhibition, Invalides esplanade","Paris","","Esplanade des Invalides","French Empire","France","Europe","national","held","","The French national exhibition on the Esplanade des Invalides, the one exception to Louvre venues before 1827. It lasted twenty-four days with 1,422 exhibitors; artists had a separate section alongside the manufacturers. Napoleon fixed its date in February 1806 to celebrate the Peace of Pressburg.","",["07","11","13","43","50","53"],"high","Exhibitor count: 1,422 (src 07) against nearly a thousand (src 43); the more precise figure is used. Src 11 places the repeated fairs at Champ de Mars or Louvre, which conflicts with the Invalides venue given by 07, 13, 50 and 53.","",48.8567,2.3522,"Paris"],["F0013",1812,"1812","","","","Württemberg general industrial exhibition (1812)","","","","","","Kingdom of Württemberg","Germany","Europe","regional","held","","The first general industrial exhibition in Württemberg, cited as the start of the region's exhibition tradition.","",["11"],"low","The town is not named in the source.","",null,null,""],["F0014",1818,"1818","","","","Munich industrial exhibition (1818)","","","Munich","","","Kingdom of Bavaria","Germany","Europe","national","held","","One of the exhibitions that followed the French national model and that Greenhalgh lists among the most important in Europe and America before 1851.","",["07"],"low","Identity rests on one listing mention with no further detail.","",48.1375,11.575,"Munich"],["F0015",1819,"1819","","","","Fifth French national industrial exhibition (Louvre, 1819)","Exposition des produits de l'industrie française","Industrial exhibition, Louvre galleries","Paris","","Louvre galleries","France (Bourbon Restoration)","France","Europe","national","held","","The fifth French national industrial exhibition, held inside the Louvre and open for thirty-five days in August and September. Louis XVIII used it for royal display, and the Légion d'honneur was awarded to industrialists as a prize for the first time.","",["07","13","43","53"],"high","Src 53 also cites the central jury report for this show in its bibliography. Day count (35) agrees across 07 and 43.","",48.8567,2.3522,"Paris"],["F0016",1820,"1820","","","","Ghent industrial exhibition (1820)","","Industrial fair (Ghent, 1820); Ghent exhibition (unnamed)","Ghent","","","United Kingdom of the Netherlands","Belgium","Europe","national","held","","An industrial fair held in the wake of the French national exhibitions, one of the imitations that foreign observers organised after 1819. No size or attendance is given.","",["07","11","43"],"medium","Src 11 lists it unnamed in the appendix table; src 07 lists it among the most important pre-1851 national exhibitions.","",51.0536,3.7253,"Ghent"],["F0017",1822,"1822","","","","Exhibition of Domestic Manufactures (Berlin, 1822)","Ausstellung vaterländischer Fabrikate","Berlin industrial exhibition (1822)","Berlin","","","Prussia","Germany","Europe","national","held","","An early Prussian industrial exhibition, one of the state and non-state exhibitions largely focused on technical education and restricted to Prussian goods.","",["06","11"],"medium","","",52.52,13.405,"Berlin"],["F0018",1823,"1823","","","","Sixth French national industrial exhibition (Louvre, 1823)","Exposition des produits de l'industrie française","Industrial exhibition, Louvre galleries; Paris national industrial exhibition (Louvre)","Paris","","Louvre galleries","France (Bourbon Restoration)","France","Europe","national","held","","The sixth French national industrial exhibition, held inside the Louvre for fifty days, with about 1,600 exhibitors. It grew steadily from the 1819 show.","",["07","11","13","43","53"],"high","","",48.8567,2.3522,"Paris"],["F0019",1823,"1823","","","","Stockholm industrial exhibition (1823)","","Stockholm national exhibition","Stockholm","","","Sweden and Norway (union)","Sweden","Europe","national","held","","One of the national exhibitions that followed the French model and that Greenhalgh lists among the most important before 1851. No further detail is given.","",["07","37"],"low","Src 37 gives the country as Sweden; src 07 gives Sweden and Norway. Both mentions are generic.","",59.3294,18.0686,"Stockholm"],["F0020",1824,"1824","","","","Franklin Institute exhibitions","","","Philadelphia","","","United States","United States","North America","other","held","institute exhibition series rather than a single national fair","A series of competitive exhibitions of mechanical models, mineral specimens and American industry, run by the Franklin Institute from 1824 and continuing for about fifty years.","",["53"],"low","Entry dates the start of the series. Year_end left blank because the run is given only as about fifty years.","",39.9528,-75.1636,"Philadelphia"],["F0021",1824,"1824","","","","Tournai industrial exhibition (1824)","","Industrial fair (Tournai, 1824)","Tournai","","","United Kingdom of the Netherlands","Belgium","Europe","national","held","","An industrial fair in the French national-exhibition model, one of the imitations organised by foreign observers. No size or attendance is given.","",["07","43"],"low","Both mentions are generic; no detail beyond the year and place.","",50.6056,3.3881,"Tournai"],["F0022",1825,"1825","","","","Haarlem industrial exhibition (1825)","","Industrial fair (Haarlem, 1825)","Haarlem","","","United Kingdom of the Netherlands","Netherlands","Europe","national","held","","An industrial fair organised as an imitation of the French national exhibitions, and one of the national exhibitions listed by Greenhalgh among the most important before 1851. No size or attendance is given.","",["07","43"],"low","Both mentions are generic.","",52.3814,4.6356,"Haarlem"],["F0023",1826,"1826","","","","Royal Dublin Society first triennial industrial exhibition","","Royal Dublin Society triennial exhibitions; Dublin industrial exhibition of 1826","Dublin","","","United Kingdom (Ireland)","Ireland","Europe","national","held","","The first of the triennial industrial and scientific exhibitions of the Royal Dublin Society, begun in the mid-1820s on the model of the French national exhibitions. Sources disagree on its date, giving 1825, 1826 or 1829.","",["07"],"low","Date disputed (1825, 1826 or 1829; footnote 14 of src 07). 1826 is used because the dedicated Dublin row gives it; cluster 27 gives 1825, so the year is unresolved. Merged on the basis of the shared disputed first RDS exhibition, not a confirmed match. Scope: cluster 27 says regional, cluster 29 national. Cluster 27 says the largest was in 1850, which does not fit the series described in cluster 42.","",53.35,-6.2603,"Dublin"],["F0024",1827,"1827","","","","Prussian trade exhibition (Berlin, 1827)","Preußische Gewerbeausstellung","Berlin industrial exhibition (1827)","Berlin","","","Prussia","Germany","Europe","national","held","","An early Prussian industrial exhibition, one of the state and non-state exhibitions largely focused on technical education and restricted to Prussian goods.","",["06","11"],"medium","","",52.52,13.405,"Berlin"],["F0025",1827,"1827","","","","Public Exhibition of Spanish Industry (Madrid, 1827)","","Madrid industrial exhibition (1827)","Madrid","","","Spain","Spain","Europe","national","held","","The first of the annual public exhibitions of Spanish industry, ordered by a royal decree of 30 March 1826; subsequent exhibitions were discontinued.","",["06","07"],"medium","Src 07 also lists it generically among the pre-1851 national exhibitions.","",40.4169,-3.7033,"Madrid"],["F0026",1827,"1827","","","","Nantes provincial exhibition (1827)","","","Nantes","","","France (Restoration)","France","Europe","regional","held","","One of the French provincial exhibitions that followed the Paris national shows.","",["07"],"low","Single generic mention.","",47.2181,-1.5528,"Nantes"],["F0027",1827,"1827","","","","French national exhibition of 1827 (Louvre)","Exposition des produits de l'industrie française","Industrial exhibition, Louvre galleries; Paris national exhibition (unnamed); Seventh French national industrial exhibition (Paris, 1827)","Paris","","Louvre galleries","France (Bourbon Restoration)","France","Europe","national","held","","The last of the 1819, 1823 and 1827 Louvre shows, lasting sixty-two days with 1,695 exhibitors. Some manufacturers were reluctant to show their goods to foreign visitors for fear of losing trade secrets.","",["07","11","13","43","53"],"high","Exhibitor count: 1,695 (src 07) against about 1,600 (src 43, which says it was not much more than 1823). Cluster 34 (an unnamed 1827 Paris row in the src 11 appendix) is merged as the only Paris national show of that year.","",48.8567,2.3522,"Paris"],["F0028",1828,"1828","","","","National Repository for the Exhibition of New and Improved Productions of the Artisans and Manufacturers of the United Kingdom","","The 'toy-shop' (press nickname)","London","","Gallery over the Royal Mews, Trafalgar Square","Great Britain","United Kingdom","Europe","national","held","semi-permanent repository rather than a fair","A semi-permanent show in a gallery over the Royal Mews, Trafalgar Square, poorly received and dubbed 'the toy-shop' by press and public. After some four progressively worse exhibitions the attempts ceased.","",["50"],"medium","Single source (src 50). Number of shows and end date are not given beyond 'some four'.","",51.5072,-0.1275,"London"],["F0029",1828,"1828","","","","New York industrial exhibition (1828)","","New York national exhibition (1828)","Ne an international element.","",["07","37","43"],"medium","Scope: srcs 07 and 37 call it national with an international element; src 43 does not say which. Recorded as national.","",50.8467,4.3525,"Brussels"],["F0034",1834,"1834","","","","Zollverein exhibition (Berlin, 1834)","","","Berlin","","","German Zollverein (Prussia)","Germany","Europe","national","held","","A large exhibition in Berlin held by the German Zollverein customs union, one of the early imitations of the French national exhibitions.","",["43"],"low","Single mention (src 43).","",52.52,13.405,"Berlin"],["F0035",1834,"1834","","","","French national industrial exhibition (Place de la Concorde, 1834)","Exposition des produits de l'industrie française","Industrial exhibition, Place de la Concorde; French National Exhibition (Place de la Concorde)","Paris","","Place de la Concorde","France (July Monarchy)","France","Europe","national","held","","The French national industrial exhibition of the July Monarchy, held in four temporary wooden pavilions on the Place de la Concorde and opened days after the 1834 Salon closed. It had about 2,400 exhibitors, and requests were made as early as 1834 for foreign manufacturers to be admitted.","",["07","13","43","50","53"],"high","Src 13 figure caption dates it to 1833; the text and the other mentions give 1834, which is used. Src 50 infers the year from the venue change, so its date is low confidence on its own.","",48.8567,2.3522,"Paris"],["F0036",1834,"1834","","1834-05","","Royal Dublin Society industrial and scientific exhibition (1834)","","Irish National Exhibitions of Manufactures (Royal Dublin Society triennial series)","Dublin","","","United Kingdom (Ireland)","Ireland","Europe","national","held","","Triennial industrial and scientific exhibitions held by the Royal Dublin Society from 1834 on French national exhibition lines. They helped inspire the 1853 Dublin exhibition.","",["35","50"],"medium","Src 50 gives the series as running 1834-1853 (year_end 1853 in that row); the 1853 show is a separate fair and is not merged here. Scope: src 35 says regional, src 50 says national. Start month 1834-05 from src 50 only.","",53.35,-6.2603,"Dublin"],["F0037",1835,"1835","","","","Bordeaux provincial exhibition (1835)","","","Bordeaux","","","France (July Monarchy)","France","Europe","regional","held","","One of the French provincial exhibitions that followed the Paris national shows. Bordeaux held provincial exhibitions in 1835 and 1845.","",["07"],"low","Single generic mention; the 1845 Bordeaux show is a separate entry.","",44.84,-0.58,"Bordeaux"],["F0038",1835,"1835","","","","Lille provincial exhibition (1835)","","","Lille","","","France (July Monarchy)","France","Europe","regional","held","","One of the French provincial exhibitions that followed the Paris national shows.","",["07"],"low","Single generic mention.","",50.6278,3.0583,"Lille"],["F0039",1836,"1836","","","","Dijon provincial exhibition (1836)","","","Dijon","","","France (July Monarchy)","France","Europe","regional","held","","One of the French provincial exhibitions that followed the Paris national shows.","",["07"],"low","Single generic mention.","",47.3167,5.0167,"Dijon"],["F0040",1836,"1836","","","","Toulouse provincial exhibition (1836)","","","Toulouse","","","France (July Monarchy)","France","Europe","regional","held","","One of the French provincial exhibitions that followed the Paris national shows.","",["07"],"low","Single generic mention.","",43.6045,1.444,"Toulouse"],["F0041",1839,"1839","","","","Birmingham exhibition (1839)","","","Birmingham","","","Great Britain","United Kingdom","Europe","regional","held","small mechanics' institute show, mainly pictures and manufactures","The first recorded exhibition of a few good pictures and sundry manufactures staged by the Birmingham mechanics' institution. It was followed later the same year by a more comprehensive event.","",["06"],"low","The more comprehensive 1839 Birmingham event is not identif   const q = fold($("q").value.trim()), ws = q.split(/\s+/).filter(Boolean), reg = $("reg").value, sc = $("scope").value, st = $("stat").value, mn = +$("mn").value, bm = $("bm").value, src = $("src").value;
  const [a,b] = yr(), full = a === YMIN && b === YMAX;
  return R.filter(r => ws.every(w => r.f.includes(w)) && (!reg || r[14] === reg) && (!sc || r[15] === sc)
    && (!st || (st === "not" ? (r[16] === "never_held" || r[16] === "cancelled") : r[16] === st))
    && r[20].length >= mn && (bm === "hide" ? !r[17] : bm === "only" ? !!r[17] : true) && (!src || r[20].includes(src))
    && (full || (r[1] && r[1] <= b && (+r[3] || r[1]) >= a))
    && (skipLoc || !loc || r[26] === loc));
}
function card(r, q){
  const no = r[16] === "never_held" || r[16] === "cancelled";
  const badges = [];
  if(r[16] === "never_held") badges.push('<span class="b flag" data-f="stat:never_held" title="Planned or proposed but never took place — click to filter">NEVER HELD</span>');
  if(r[16] === "cancelled") badges.push('<span class="b flag" data-f="stat:cancelled" title="Announced or prepared, then abandoned — click to filter">CANCELLED</span>');
  if(r[16] === "planned") badges.push('<span class="b plan" data-f="stat:planned" title="Known in the texts only as a plan; the outcome is not stated — click to filter">planned</span>');
  badges.push(`<span class="b ${esc(r[15])}" data-f="scope:${esc(r[15])}" title="Click to show only ${esc(r[15])} fairs">${esc(r[15])}</span>`);
  if(r[17]) badges.push(`<span class="b bord" data-f="bm:only" title="${esc(r[17])} — click to show only borderline entries">borderline</span>`);
  const tt = Math.log(r[20].length) / Math.log(maxT);
  badges.push(`<span class="b n" style="background:${ramp(tt)};border-color:${ramp(tt)};color:${tt > 0.38 ? "#fff" : "#3a1410"}" title="Number of the texts that mention this fair">${r[20].length} text${r[20].length === 1 ? "" : "s"}</span>`);
  const city = r[9] ? `<b>${hl(r[9], q)}</b>` + (r[10] ? ` (then ${hl(r[10], q)})` : "") : "";
  const where = [city + (r[11] ? ", " + hl(r[11], q) : ""), hl(r[12], q), dates(r), r[19] ? "visitors: " + esc(r[19]) : ""].filter(Boolean).join(" · ");
  const yr = r[3] && r[3] !== r[2] ? r[2] + "–" + r[3] : r[2];
  return `<div class="it${no ? " no" : ""}${r[17] ? " bl" : ""}${open.has(r[0]) ? " open" : ""}" data-id="${r[0]}">
    <div class="top"><span class="nm">${cjk(hl(r[6], q))}</span>${r[7] ? `<span class="orig">${cjk(hl(r[7], q))}</span>` : ""}<span class="badges">${badges.join("")}</span></div>
    <div class="where">${where}</div>
    ${r[18] ? `<p class="desc">${hl(r[18], q)}</p>` : ""}
    ${PAGES[r[0]] ? `<a class="sp" href="fairs/${PAGES[r[0]]}.html">Study page: in-depth description, annotated bibliography, sources →</a>` : ""}
    <div class="more">
      ${r[23] ? `<div class="ed"><span class="lab">Editorial note, not from the texts</span> ${esc(r[23])}</div>` : ""}
      ${r[8] ? `<div><span class="lab">Also called</span> ${cjk(esc(r[8]))}</div>` : ""}
      ${r[17] ? `<div><span class="lab">Borderline</span> ${esc(r[17])}</div>` : ""}
      ${r[22] ? `<div><span class="lab">Notes</span> ${esc(r[22])}</div>` : ""}
      <div><span class="lab">Years</span> ${esc(yr || "undated")} · <span class="lab">Confidence</span> ${esc(r[21])} · <span class="lab">Present-day country</span> ${esc(r[13])}</div>
      <div style="margin-top:6px"><span class="lab">Mentioned in ${r[20].length} of the texts</span><ul>${r[20].map(s => `<li>${esc(SRC[s] || s)}</li>`).join("")}</ul></div>
    </div></div>`;
}
function render(){
  const rows = current(), q = fold($("q").value.trim());
  // histogram (ignores the year range so the whole distribution stays visible)
  const cnt = {}; (() => { const s1 = $("y1").value, s2 = $("y2").value; $("y1").value = YMIN; $("y2").value = YMAX; const all = current(); $("y1").value = s1; $("y2").value = s2; return all; })().forEach(r => { if(r[1]){ const d = Math.max(1750, Math.floor(r[1]/10)*10); cnt[d] = (cnt[d]||0) + 1; } });
  const mx = Math.max(1, ...Object.values(cnt));
  const [ya, yb] = yr(), yfull = ya === YMIN && yb === YMAX;
  $("y1l").textContent = ya; $("y2l").textContent = yb;
  $("yfill").style.left = ((ya-YMIN)/(YMAX-YMIN)*100) + "%"; $("yfill").style.width = ((yb-ya)/(YMAX-YMIN)*100) + "%";
  $("hist").innerHTML = decades.map(d => `<button data-d="${d}" class="${(d + 9 < ya || d > yb) ? "off" : ""}" style="height:${cnt[d] ? Math.max(4, Math.round(cnt[d]/mx*100)) : 0}%" title="${d}s: ${cnt[d]||0} fairs — click to show this decade"></button>`).join("");
  drawMap();
  $("histlab").innerHTML = decades.map(d => `<span>${d % 50 === 0 ? d : ""}</span>`).join("");
  let shown = rows;
  const nh = shown.filter(r => r[16] === "never_held" || r[16] === "cancelled").length;
  $("status").innerHTML = (loc ? `<span class="chip" id="locchip" title="Clear the location filter">Location: ${esc(loc)} ✕</span>` : "") + esc(`${shown.length.toLocaleString()} fairs` + (yfull ? "" : `, ${ya}–${yb}`) + ` · ${nh} never held or cancelled · click an entry for sources and notes · click a tag to filter by it · shift-click to copy a name`);
  if(!shown.length){ $("tl").innerHTML = '<div class="empty">No fairs match these filters.</div>'; return; }
  let h = "";
  if($("byn").checked){
    shown = shown.slice().sort((a,b) => b[20].length - a[20].length || (a[1]||9999) - (b[1]||9999));
    h = '<div class="items" style="border:0;padding:0">' + shown.map(r => `<div class="yr"><div class="y" style="position:static">${esc(r[2] || "n.d.")}</div><div class="items">${card(r,q)}</div></div>`).join("") + "</div>";
  } else {
    let cd = null, cy = undefined, buf = "";
    const flush = () => { if(buf){ h += `<div class="yr"><div class="y">${cy || "n.d."}</div><div class="items">${buf}</div></div>`; buf = ""; } };
    for(const r of shown){
      const d = r[1] ? Math.floor(r[1]/10)*10 : "undated";
      if(d !== cd){ flush(); cd = d; const n = shown.filter(x => (x[1] ? Math.floor(x[1]/10)*10 : "undated") === d).length; h += `<div class="decade" id="d${d}">${d === "undated" ? "Undated" : d + "s"}<small>${n} fair${n === 1 ? "" : "s"}</small></div>`; cy = undefined; }
      if(r[1] !== cy){ flush(); cy = r[1]; }
      buf += card(r, q);
    }
    flush();
  }
  $("tl").innerHTML = h;
}
function toast(msg){ let t = $("toast"); if(!t){ t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); } t.textContent = msg; t.className = "on"; clearTimeout(toast.h); toast.h = setTimeout(() => t.className = "", 1600); }
function copyText(txt){
  const fb = () => { const ta = document.createElement("textarea"); ta.value = txt; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); let ok = false; try{ ok = document.execCommand("copy"); }catch(e){} ta.remove(); return ok; };
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(() => true, () => fb());
  return Promise.resolve(fb());
}
$("tl").addEventListener("mousedown", e => { if(e.shiftKey && e.target.closest(".it")) e.preventDefault(); });
$("tl").addEventListener("click", e => { const tag = e.target.closest(".b[data-f]");
  if(tag && !e.shiftKey){ const [k, v] = tag.dataset.f.split(":"); const el = $(k); el.value = el.value === v ? "" : v; render(); return; }
  if(e.target.closest(".sp")) return;
  const it = e.target.closest(".it"); if(!it) return;
  if(e.shiftKey){ const r = R.find(x => x[0] === it.dataset.id); copyText(r[6]).then(ok => toast(ok ? "Copied: " + r[6] : "Could not copy")); return; }
  if(window.getSelection().toString()) return;
  const id = it.dataset.id; open.has(id) ? open.delete(id) : open.add(id); it.classList.toggle("open"); });
$("hist").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; const d = +b.dataset.d, [a, c] = yr();
  if(a === d && c === Math.min(YMAX, d + 9)){ $("y1").value = YMIN; $("y2").value = YMAX; } else { $("y1").value = Math.max(YMIN, d); $("y2").value = Math.min(YMAX, d + 9); } render(); });
["q","reg","scope","stat","mn","bm","byn","src","y1","y2"].forEach(id => $(id).addEventListener("input", render));
$("yall").addEventListener("click", () => { $("y1").value = YMIN; $("y2").value = YMAX; render(); });
$("status").addEventListener("click", e => { if(e.target.closest("#locchip")){ loc = null; render(); } });
$("reset").addEventListener("click", () => { $("q").value = ""; ["reg","scope","stat","src","bm"].forEach(id => $(id).value = ""); $("mn").value = "1"; $("byn").checked = false; $("y1").value = YMIN; $("y2").value = YMAX; loc = null; setView(VIEWS.world); render(); });
// ---- map
const VIEWS = {world:[0,0,1000,500], europe:[452,62,150,75], namerica:[130,95,240,120], easia:[770,120,170,85], sasia:[670,150,130,65], oceania:[790,290,210,105]};
let vb = VIEWS.world.slice();
const px = (lon) => (lon + 180) / 360 * 1000, py = (lat) => (84 - lat) / 144 * 500;
function setView(v){ let [x,y,w,h] = v; w = Math.max(18, Math.min(1000, w)); h = w / 2; x = Math.max(0, Math.min(1000 - w, x)); y = Math.max(0, Math.min(500 - h, y)); vb = [x,y,w,h]; $("map").setAttribute("viewBox", vb.join(" ")); drawMap(); }
function drawMap(){
  const g = {}; current(true).forEach(r => { if(r[24] == null) return; const k = r[26]; (g[k] = g[k] || {k, lat:r[24], lon:r[25], n:0}).n++; });
  const pts = Object.values(g).sort((a,b) => a.n - b.n), mx = Math.max(1, ...pts.map(p => p.n)), rad = 4.4 * vb[2] / 1000;
  $("dots").innerHTML = pts.map(p => `<circle cx="${px(p.lon).toFixed(2)}" cy="${py(p.lat).toFixed(2)}" r="${rad.toFixed(3)}" fill="${binCol(p.n)}" data-k="${esc(p.k)}" data-n="${p.n}"${p.k === loc ? ' class="sel"' : ""}></circle>`).join("");
}
(function(){ const svg = $("map"); let drag = null, moved = false;
  const pt = e => { const b = svg.getBoundingClientRect(); return [vb[0] + (e.clientX - b.left) / b.width * vb[2], vb[1] + (e.clientY - b.top) / b.height * vb[3], b]; };
  svg.addEventListener("wheel", e => { e.preventDefault(); const [mx, my] = pt(e), f = e.deltaY > 0 ? 1.25 : 0.8, w = Math.max(18, Math.min(1000, vb[2] * f)), k = w / vb[2]; setView([mx - (mx - vb[0]) * k, my - (my - vb[1]) * k, w, w / 2]); }, {passive:false});
  const P = new Map(); let pinch = null;
  const two = () => { const [a, b] = [...P.values()]; return {d: Math.hypot(a.x - b.x, a.y - b.y) || 1, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2}; };
  svg.addEventListener("pointerdown", e => { P.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(P.size === 2){ const t = two(), b = svg.getBoundingClientRect(); pinch = {d:t.d, w:vb[2], ax: vb[0] + (t.cx - b.left) / b.width * vb[2], ay: vb[1] + (t.cy - b.top) / b.height * vb[3]}; drag = null; moved = true; $("tip").className = ""; return; }
    if(P.size > 2) return;
    drag = {x:e.clientX, y:e.clientY, vx:vb[0], vy:vb[1]}; moved = false; });
  window.addEventListener("pointermove", e => { if(P.has(e.pointerId)) P.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch && P.size === 2){ const t = two(), b = svg.getBoundingClientRect(), w = Math.max(18, Math.min(1000, pinch.w * pinch.d / t.d));
      setView([pinch.ax - (t.cx - b.left) / b.width * w, pinch.ay - (t.cy - b.top) / b.height * (w / 2), w, w / 2]); return; }
    if(!drag) return; const b = svg.getBoundingClientRect(), dx = e.clientX - drag.x, dy = e.clientY - drag.y; if(Math.abs(dx) + Math.abs(dy) > 4){ moved = true; svg.classList.add("drag"); } if(moved) setView([drag.vx - dx / b.width * vb[2], drag.vy - dy / b.height * vb[3], vb[2], vb[3]]); });
  const up = e => { P.delete(e.pointerId); pinch = null; drag = null; svg.classList.remove("drag"); };
  window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
  const tip = $("tip");
  svg.addEventListener("pointermove", e => { const c = e.target.closest ? e.target.closest("circle") : null; if(!c || drag && moved){ tip.className = ""; return; }
    const b = svg.parentNode.getBoundingClientRect(), cb = c.getBoundingClientRect(); tip.textContent = c.dataset.k + " · " + c.dataset.n + (c.dataset.n === "1" ? " fair" : " fairs");
    tip.style.left = (cb.left + cb.width / 2 - b.left) + "px"; tip.style.top = (cb.top - b.top) + "px"; tip.className = "on"; });
  svg.addEventListener("pointerleave", () => { tip.className = ""; });
  svg.addEventListener("click", e => { if(moved) return; const c = e.target.closest("circle"); if(!c) return; const k = c.dataset.k; loc = loc === k ? null : k; render(); if(loc){ const f = document.querySelector(".filters"), sticky = getComputedStyle(f).position === "sticky" ? f.offsetHeight : 0; window.scrollTo({top: $("status").getBoundingClientRect().top + window.scrollY - sticky - 6, behavior:"smooth"}); } });
  document.querySelector(".mapbtns").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; const v = b.dataset.v;
    if(v === "in" || v === "out"){ const f = v === "in" ? 0.6 : 1 / 0.6, w = vb[2] * f, cx = vb[0] + vb[2] / 2, cy = vb[1] + vb[3] / 2; setView([cx - w / 2, cy - w / 4, w, w / 2]); } else setView(VIEWS[v]); });
})();
const regs = [...new Set(R.map(r => r[14]).filter(Boolean))].sort();
$("reg").innerHTML += regs.map(x => `<option>${esc(x)}</option>`).join("");
const used = Object.keys(SRC).filter(s => R.some(r => r[20].includes(s))).sort((a,b) => SRC[a].localeCompare(SRC[b]));
$("src").innerHTML += used.map(s => `<option value="${s}">${esc(SRC[s])} (${R.filter(r => r[20].includes(s)).length})</option>`).join("");
const yrs = R.map(r => r[1]).filter(Boolean);
$("lede").textContent = `${R.length.toLocaleString()} national, international, colonial and regional exhibitions from ${Math.min(...yrs)} to ${Math.max(...yrs)}, compiled from every mention in ${used.length} books and articles. Dates, places and descriptions are taken from those texts; a blank means none of them gave it. Fairs that were planned but never held are shown with a dashed outline.`;
$("legend").innerHTML = BINS.map(b => `<span><i style="background:${b[2]}"></i>${b[1]}</span>`).join("");
render();
</script>
