   +'<p>The reader draws the pages itself, so nothing is downloaded. Opened from disk, a browser lets a page read other files only after you point it to the folder: choose the project folder (the one that contains this page) or its <code>books</code> folder.</p>'
   +'<p><button class="pri" id="grant" type="button">'+(known?'Allow access to “'+escH(dirHandle.name)+'”':'Choose the books folder')+'</button>'+(known?' <button id="regrant" type="button">Choose another folder</button>':'')+'</p>'
   +(canPick?'<p class="ui lab">This browser remembers the folder; on later visits one click on “Allow” is enough.</p>':'<p class="ui lab">This browser asks again on each visit. To avoid that, start the reader with the launcher (below).</p>')
   +'<p class="ui lab">No prompts at all: double-click <code>Open Reader.command</code> in the project folder. It serves the folder on this computer only and opens the site in the browser.</p>'
   +'<p class="ui"><a href="'+d.u+'#page='+state.p+'" target="_blank" rel="noopener">Open the file with the browser instead</a> <span class="lab">(may download it, depending on browser settings)</span></p>'
   +'<input id="dirin" type="file" webkitdirectory multiple style="display:none"></div>';
  const choose=async()=>{
    if(canPick){try{dirHandle=await window.showDirectoryPicker({id:'exhibition-books',mode:'read'});await kvSet('dir',dirHandle);}catch(e){return;}open(state.t,state.p,state.pp);}
    else $('dirin').click();
  };
  $('grant').onclick=async()=>{
    if(known){try{if((await dirHandle.requestPermission({mode:'read'}))==='granted'){open(state.t,state.p,state.pp);return;}}catch(e){}}
    choose();
  };
  if($('regrant'))$('regrant').onclick=choose;
  $('dirin').onchange=e=>{picked=new Map();for(const f of e.target.files){if(/\.(pdf|epub)$/i.test(f.name))picked.set(nfc(f.name),f);}open(state.t,state.p,state.pp);};
}

/* ---- drawing pages with PDF.js ---- */
let doc=null, docN=null, seq=0, workerLoaded=null;
function loadWorkerInline(){   // a page opened from disk cannot start a worker from a file; run PDF.js on the main thread instead
  if(!workerLoaded)workerLoaded=new Promise(res=>{const s=document.createElement('script');s.src='vendor/pdfjs/pdf.worker.min.js';s.onload=()=>res(true);s.onerror=()=>res(false);document.head.appendChild(s);});
  return workerLoaded;
}
/* file:// only. A page opened from disk may not read a PDF, but it may load a script. build_reader.py therefore
   writes each PDF a second time as a script (books/_reader/NN.js, base64 in pieces); the reader loads that and
   needs no permission, no server and no download. */
const wrapped={};
function readWrapped(n){
  if(n in wrapped)return wrapped[n];
  wrapped[n]=new Promise(res=>{
    const parts=[];let total=0,size=0;
    window.__BOOK=(id,i,tot,b64)=>{if(id!==n)return;const bin=atob(b64),a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);parts[i]=a;total=tot;size+=a.length;};
    const sc=document.createElement('script');sc.src='books/_reader/'+n+'.js';
    sc.onload=()=>{sc.remove();if(!total||parts.filter(Boolean).length!==total){res(null);return;}
      const out=new Uint8Array(size);let o=0;for(const a of parts){out.set(a,o);o+=a.length;}res(out.buffer);};
    sc.onerror=()=>{sc.remove();res(null);};document.head.appendChild(sc);});
  return wrapped[n];
}
const direct={};   // file:// only: bytes read straight from books/ (some browsers allow it)
function readDirect(n){
  if(n in direct)return Promise.resolve(direct[n]);
  return new Promise(res=>{try{const x=new XMLHttpRequest();x.open('GET',D[n].u);x.responseType='arraybuffer';x.timeout=20000;
    x.onload=()=>{const ok=x.response&&x.response.byteLength>1000;direct[n]=ok?x.response:null;res(direct[n]);};
    x.onerror=x.ontimeout=()=>{direct[n]=null;res(null);};x.send();}catch(e){direct[n]=null;res(null);}});
}
let served;        // file:// only: is the launcher's local server running? then use it, it needs no permission
function findServer(){
  if(served!==undefined)return Promise.resolve(served);
  return new Promise(res=>{let left=4,done=false;const fin=v=>{if(!done){done=true;served=v;res(v);}};
    window.EXH_READER=0;
    for(let port=8765;port<8769;port++){const sc=document.createElement('script');sc.src='http://127.0.0.1:'+port+'/books.local.js?probe='+Date.now();
      sc.onload=()=>{if(window.EXH_READER===1)fin('http://127.0.0.1:'+port);else if(--left===0)fin(null);};
      sc.onerror=()=>{if(--left===0)fin(null);};document.head.appendChild(sc);}
    setTimeout(()=>fin(null),1500);});
}
async function loadDoc(n){
  if(docN===n&&doc)return doc;
  if(doc){try{doc.destroy();}catch(e){}}doc=null;docN=null;
  let src;
  if(HTTP){pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdfjs/pdf.worker.min.js';src={url:D[n].u};}
  else{const w=await readWrapped(n);const f=w?null:await localFile(n);const buf=w||(f?await f.arrayBuffer():await readDirect(n));if(!buf)return null;await loadWorkerInline();pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdfjs/pdf.worker.min.js';src={data:new Uint8Array(buf.slice(0))};}
  doc=await pdfjsLib.getDocument(Object.assign(src,{isEvalSupported:false})).promise;docN=n;return doc;
}
async function draw(){
  const my=++seq, st=$('stage');
  if(!st.querySelector('.sheet'))st.innerHTML='';
  let busy=st.querySelector('.busy');if(!busy){busy=document.createElement('div');busy.className='busy';st.prepend(busy);}busy.textContent='Loading page '+state.p+'…';
  const page=await doc.getPage(state.p);if(my!==seq)return;
  const base=page.getViewport({scale:1}), fit=Math.max(0.3,(st.clientWidth-30)/base.width), scale=Math.min(fit,1.9)*state.zoom;
  const vp=page.getViewport({scale}), dpr=Math.min(window.devicePixelRatio||1,2);
  const sheet=document.createElement('div');sheet.className='sheet';sheet.style.width=Math.floor(vp.width)+'px';sheet.style.height=Math.floor(vp.height)+'px';
  const cv=document.createElement('canvas');cv.width=Math.floor(vp.width*dpr);cv.height=Math.floor(vp.height*dpr);cv.style.width=Math.floor(vp.width)+'px';cv.style.height=Math.floor(vp.height)+'px';
  sheet.appendChild(cv);
  await page.render({canvasContext:cv.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;if(my!==seq)return;
  try{const tc=await page.getTextContent();const tl=document.createElement('div');tl.className='textLayer';tl.style.setProperty('--scale-factor',scale);
    tl.style.width=Math.floor(vp.width)+'px';tl.style.height=Math.floor(vp.height)+'px';sheet.appendChild(tl);
    pdfjsLib.renderTextLayer({textContentSource:tc,container:tl,viewport:vp,textDivs:[]});}catch(e){}
  st.innerHTML='';st.appendChild(sheet);st.scrollTop=0;
}
function nativeFrame(n){$('stage').innerHTML='';const fr=document.createElement('iframe');fr.title=D[n].s;fr.src=D[n].u+'#page='+state.p+'&view=FitH';$('stage').appendChild(fr);}

/* ---- the page ---- */
function list(){
  $('list').innerHTML=order.map(n=>'<a class="bk" data-n="'+n+'" href="?t='+n+'"><span class="dot"></span>'+D[n].c+'<small>'+(D[n].k==='epub'?'EPUB (no page jumps)':(D[n].pp.length?D[n].pp.length+' pages':'PDF'))+'</small></a>').join('');
  $('list').addEventListener('click',e=>{const a=e.target.closest('.bk');if(!a)return;e.preventDefault();open(a.dataset.n,1,'',true);});
  $('f').addEventListener('input',()=>{const w=fold($('f').value.trim());document.querySelectorAll('.bk').forEach(a=>{a.style.display=fold(a.textContent).includes(w)?'':'none'});});
  (async()=>{for(const n of order){await check(n);}
    const v=Object.values(state.avail),yes=v.filter(x=>x===true).length, known=HTTP||Array.isArray(window.LOCAL_BOOKS);
    $('sum').textContent=known?(yes+' of '+order.length+' book files found '+(HTTP?'here':'in this folder')+(yes===0?(HTTP?': the books are not published with this site':': put the files in the books folder and run build_reader.py again'):'')):'Opened from disk without a file list: a book opens if its file is in the books folder';})();
}
function missing(n,p,pp,why){
  const d=D[n], printed=pp||printedOf(n,p);
  $('stage').innerHTML='<div class="msg"><h2>'+(why||'This book is not available here')+'</h2>'
   +'<p>The page reference you followed is:</p><p class="cite">'+d.c+(printed?' <span class="big">p. '+printed+'</span>':'')+(p&&d.k==='pdf'?' <span class="lab ui">(page '+p+' of the PDF file)</span>':'')+'</p>'
   +(why==='No books were found'?'<p><b>The reader looked in the <code>books</code> folder beside this page and found none of the '+order.length+' works.</b></p>':'')
   +'<p>The books this site is built from are under copyright and are not published with it, so the reader works only where the files are present, for example in a local copy of the site.</p>'
   +'<p class="ui lab">'+(HTTP?'To use it on your own computer, put the file below in a folder named <code>books</code> beside this page:':'This file was not in the <code>books</code> folder when the file list was last made. Put it there under exactly this name and run <code>build_reader.py</code> again:')+'<br><code>'+escH(d.f)+'</code></p>'
   +'<p class="ui"><a href="contents.html#t'+n+'">Contents and chapter overviews of this work</a></p></div>';
}
async function open(n,p,pp,push){
  if(!D[n]){$('stage').innerHTML='<div class="msg"><h2>Choose a book</h2><p>Pick a work from the list, or follow a page reference from a study page, the contents page or the approaches page.</p></div>';return;}
  state.t=n;state.p=Math.max(1,parseInt(p)||1);state.pp=pp||'';
  document.querySelectorAll('.bk').forEach(a=>a.classList.toggle('on',a.dataset.n===n));
  const on=document.querySelector('.bk.on');if(on&&push!==true)on.scrollIntoView({block:'center'});
  const d=D[n], isPdf=d.k==='pdf';$('ref').innerHTML=d.c;$('bar').style.display='flex';
  document.querySelectorAll('.pdfonly').forEach(x=>x.style.display=isPdf?'':'none');
  const max=(docN===n&&doc)?doc.numPages:(d.pp.length||0);if(max&&state.p>max)state.p=max;
  $('pg').value=state.p;$('pr').value=state.pp||printedOf(n,state.p);$('pr').style.display=$('lpr').style.display=(isPdf&&d.pp.length)?'':'none';
  $('prev').disabled=state.p<=1;$('next').disabled=max?state.p>=max:false;
  $('tab').href=d.u+(isPdf?'#page='+state.p:'');
  if(push){history.pushState(null,'','?t='+n+(isPdf?'&p='+state.p:''));}
  document.title=d.s+(isPdf?' p. '+($('pr').value||state.p):'')+' – Reader';
  const ok=await check(n);
  if(state.t!==n)return;
  if(ok===false){
    await Promise.all(order.map(check));if(state.t!==n)return;
    const any=Object.values(state.avail).some(x=>x===true);
    missing(n,state.p,pp,any?'':'No books were found');return;}
  if(!isPdf){
    $('stage').innerHTML='<div class="msg"><h2>This work is an EPUB</h2><p class="cite">'+d.c+'</p><p>EPUB files have no fixed pages, so the reader cannot show a page of it, and references to this work carry no page number.</p><p class="ui"><a href="'+d.u+'">Open or download the EPUB file</a>'+(ok===null?' (this works only if the file is in this folder)':'')+'</p><p class="ui"><a href="contents.html#t'+n+'">Contents and chapter overviews of this work</a></p></div>';return;}
  if(!window.pdfjsLib){nativeFrame(n);return;}       // PDF.js missing: fall back to the browser's own viewer
  try{
    if(!HTTP&&!(await readWrapped(n))&&!(await localFile(n))){
      if(!dirHandle)dirHandle=await kvGet('dir')||null;
      if(!(await localFile(n))&&!(await readDirect(n))){
        const srv=await findServer();
        if(srv){location.replace(srv+'/reader.html?t='+n+'&p='+state.p+(state.pp?'&pp='+encodeURIComponent(state.pp):''));return;}
        accessPanel(n);return;
      }
    }
    const dd=await loadDoc(n);if(state.t!==n)return;
    if(!dd){accessPanel(n);return;}
    if(state.p>dd.numPages){state.p=dd.numPages;$('pg').value=state.p;}
    $('next').disabled=state.p>=dd.numPages;$('of').textContent='of '+dd.numPages;
    await draw();
  }catch(e){
    if(HTTP&&/Missing PDF|404|Unexpected server response/i.test(String(e&&e.message))){missing(n,state.p,pp);return;}
    $('stage').innerHTML='<div class="msg"><h2>The page could not be drawn</h2><p class="cite">'+d.c+'</p><p class="ui lab">'+escH(String(e&&e.message||e))+'</p><p class="ui"><a href="'+d.u+'#page='+state.p+'" target="_blank" rel="noopener">Open the file with the browser instead</a></p></div>';
  }
}
function go(p){open(state.t,p,'',true);}
function wire(){
  $('prev').onclick=()=>go(state.p-1);$('next').onclick=()=>go(state.p+1);$('go').onclick=()=>go($('pg').value);
  $('zin').onclick=()=>{state.zoom=Math.min(3,state.zoom*1.2);if(doc)draw();};$('zout').onclick=()=>{state.zoom=Math.max(0.4,state.zoom/1.2);if(doc)draw();};$('zfit').onclick=()=>{state.zoom=1;if(doc)draw();};
  $('pg').addEventListener('keydown',e=>{if(e.key==='Enter')go($('pg').value)});
  $('pr').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const k=pdfOf(state.t,$('pr').value);if(k)go(k);else{$('pr').style.outline='2px solid var(--no)';setTimeout(()=>$('pr').style.outline='',900);}});
  document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||!state.t||D[state.t].k!=='pdf'||e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key==='ArrowRight'||e.key==='PageDown'){if(!$('next').disabled){e.preventDefault();go(state.p+1);}}
    if(e.key==='ArrowLeft'||e.key==='PageUp'){if(state.p>1){e.preventDefault();go(state.p-1);}}});
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(doc&&docN===state.t&&$('stage').querySelector('.sheet'))draw();},200);});
  window.addEventListener('popstate',()=>{const q=new URLSearchParams(location.search);open(q.get('t'),q.get('p'),q.get('pp'));});
}
list();wire();open(qs.get('t'),qs.get('p'),qs.get('pp'));
</script></body></html>
